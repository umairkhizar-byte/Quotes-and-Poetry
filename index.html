<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>اقوال و اشعار — روزانہ اردو اقوال اور شعر</title>
<meta name="description" content="روزانہ دس منتخب اردو اقوال اور دس لازوال اشعار" />
<meta name="theme-color" content="#7A2331" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#17120F;
    --ink-2:#1F1712;
    --parchment:#F1E6C8;
    --parchment-2:#E9DAB0;
    --maroon:#7A2331;
    --maroon-deep:#5E1A25;
    --gold:#B78A3D;
    --gold-soft:#C5A059;
    --ink-text:#2C2118;
    --cream:#EFE6D2;
    --cream-dim:#C9BEA9;
    --teal:#35544B;
    --max:560px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--ink);
    color:var(--cream);
    font-family:"Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
  }

  body{
    min-height:100vh;
    padding-bottom:48px;
  }

  .wrap{
    max-width:var(--max);
    margin:0 auto;
    padding:0 20px;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    padding:38px 0 30px;
    text-align:center;
    border-bottom:1px solid rgba(183,138,61,0.35);
  }

  .hero-watermark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:min(56vw, 340px);
    line-height:1;
    color:var(--maroon);
    opacity:0.10;
    pointer-events:none;
    user-select:none;
    transform:translateY(-6%);
  }

  .hero-inner{ position:relative; }

  .hero-date{
    font-family:Georgia, "Times New Roman", serif;
    direction:ltr;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--gold-soft);
    opacity:0.85;
    margin-bottom:10px;
  }

  .hero h1{
    margin:0;
    font-weight:700;
    font-size:44px;
    line-height:1.35;
    color:var(--parchment);
  }

  .hero p.tagline{
    margin:10px auto 0;
    max-width:320px;
    font-size:17px;
    color:var(--cream-dim);
    line-height:1.9;
  }

  .refresh-btn{
    margin-top:18px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    font-family:"Noto Nastaliq Urdu", serif;
    font-size:15px;
    padding:8px 18px;
    border-radius:3px;
    cursor:pointer;
  }
  .refresh-btn:active{ background:rgba(183,138,61,0.12); }
  .refresh-btn svg{ width:14px; height:14px; }

  /* ---------- Section labels ---------- */
  .section{ padding:34px 0 6px; }

  .section-label{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .section-label .rule{ flex:1; height:1px; background:linear-gradient(to left, transparent, rgba(183,138,61,0.55)); }
  .section-label .rule.rev{ background:linear-gradient(to right, transparent, rgba(183,138,61,0.55)); }
  .section-label .diamond{ width:7px;height:7px; background:var(--gold); transform:rotate(45deg); flex:0 0 auto; }
  .section-label h2{
    margin:0;
    font-size:22px;
    font-weight:700;
    color:var(--gold-soft);
    white-space:nowrap;
  }

  .section-sub{
    text-align:center;
    color:var(--cream-dim);
    font-size:14px;
    margin:-12px 0 22px;
  }

  /* ---------- Quote cards ---------- */
  .card-list{ display:flex; flex-direction:column; gap:14px; }

  .quote-card{
    position:relative;
    background:var(--parchment);
    color:var(--ink-text);
    padding:22px 22px 20px;
    border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(122,35,49,0.18);
  }
  .quote-card::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(122,35,49,0.16);
    border-radius:2px;
    pointer-events:none;
  }
  .quote-mark{
    position:absolute;
    top:14px;
    inset-inline-start:16px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--maroon);
  }
  .quote-text{
    font-size:21px;
    line-height:2.1;
    padding-inline-start:20px;
  }

  .empty-state, .error-state{
    background:var(--ink-2);
    border:1px dashed rgba(183,138,61,0.4);
    color:var(--cream-dim);
    padding:20px;
    border-radius:4px;
    text-align:center;
    font-size:15px;
    line-height:1.9;
  }

  /* ---------- Poetry cards ---------- */
  .poem-card{
    position:relative;
    background:var(--parchment-2);
    color:var(--ink-text);
    padding:20px 24px 18px;
    border-radius:3px;
    border-inline-end:4px solid var(--maroon);
  }
  .poem-verse{
    font-size:22px;
    line-height:2.15;
    white-space:pre-line;
  }
  .poem-poet{
    margin-top:12px;
    font-size:15px;
    color:var(--maroon-deep);
    opacity:0.85;
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top:40px;
    padding-top:22px;
    border-top:1px solid rgba(183,138,61,0.3);
    text-align:center;
  }
  footer p{
    font-family:Georgia, "Times New Roman", serif;
    direction:ltr;
    font-size:12px;
    color:var(--cream-dim);
    line-height:1.8;
    margin:4px 0;
  }
  .status-line{
    font-family:Georgia, serif;
    direction:ltr;
    font-size:11px;
    color:var(--gold-soft);
    opacity:0.8;
  }

  @media (max-width:380px){
    .hero h1{ font-size:36px; }
    .quote-text, .poem-verse{ font-size:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-watermark">ش</div>
  <div class="wrap hero-inner">
    <div class="hero-date" id="gregorianDate"></div>
    <h1>آجکے اقوال</h1>
    <p class="tagline">ہر روز دس نئے اقوال، اور اردو شاعری کے دس لازوال شعر</p>
    <button class="refresh-btn" id="refreshBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v6h-6"/></svg>
      مزید اقوال دیکھیں
    </button>
  </div>
</div>

<div class="wrap">

  <section class="section" id="quotesSection">
    <div class="section-label">
      <span class="rule"></span>
      <h2>آج کے اقوال</h2>
      <span class="diamond"></span>
      <span class="rule rev"></span>
    </div>
    <div class="card-list" id="quotesList">
      <div class="empty-state">اقوال لائے جا رہے ہیں…</div>
    </div>
  </section>

  <section class="section" id="poetrySection">
    <div class="section-label">
      <span class="rule"></span>
      <h2>لازوال اشعار</h2>
      <span class="diamond"></span>
      <span class="rule rev"></span>
    </div>
    <p class="section-sub">اردو شاعری کے دس منتخب اور امر شعر</p>
    <div class="card-list" id="poetryList">
      <div class="empty-state">اشعار لائے جا رہے ہیں…</div>
    </div>
  </section>

  <footer>
    <p id="statusLine" class="status-line">loading…</p>
    <p>Install this app: open your browser menu and choose &ldquo;Add to Home Screen&rdquo;.</p>
  </footer>

</div>

<script>
(function(){
  "use strict";

  var QUOTES_URL = "quotes.json";
  var POETRY_URL = "poetry.json";
  var STORAGE_KEY = "aqwal-o-ashaar:selection";

  // ---- seeded PRNG so "today's" 10 quotes are the same for everyone,
  // and change automatically at midnight (local time). ----
  function hashString(str){
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seededShuffle(arr, seedStr){
    var seedFn = hashString(seedStr);
    var rand = mulberry32(seedFn());
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(rand() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderQuotes(list){
    var el = document.getElementById("quotesList");
    if (!list || !list.length){
      el.innerHTML = '<div class="empty-state">آج کوئی قول دستیاب نہیں، براہِ کرم بعد میں دیکھیں۔</div>';
      return;
    }
    el.innerHTML = list.map(function(q){
      return '<div class="quote-card"><span class="quote-mark" aria-hidden="true"></span>' +
             '<p class="quote-text">' + escapeHtml(q.text) + "</p></div>";
    }).join("");
  }

  function renderPoetry(list){
    var el = document.getElementById("poetryList");
    if (!list || !list.length){
      el.innerHTML = '<div class="empty-state">اشعار دستیاب نہیں۔</div>';
      return;
    }
    el.innerHTML = list.map(function(p){
      return '<div class="poem-card"><p class="poem-verse">' + escapeHtml(p.verse) + '</p>' +
             '<p class="poem-poet">' + escapeHtml(p.poet) + "</p></div>";
    }).join("");
  }

  function setStatus(text){
    document.getElementById("statusLine").textContent = text;
  }

  function setGregorianDate(){
    var d = new Date();
    var opts = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    document.getElementById("gregorianDate").textContent = d.toLocaleDateString("en-GB", opts);
  }

  function pickDaily(pool, seedSuffix){
    var key = todayKey() + (seedSuffix || "");
    var shuffled = seededShuffle(pool, key);
    return shuffled.slice(0, Math.min(10, shuffled.length));
  }

  function fetchJson(url){
    return fetch(url, { cache: "no-cache" }).then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  var state = { quotesPool: [], poetryPool: [], sessionSeed: 0, lastShownDay: null };

  function refreshIfNewDay(){
    var key = todayKey();
    if (state.lastShownDay !== null && state.lastShownDay !== key && state.quotesPool.length){
      state.sessionSeed = 0;
      setGregorianDate();
      renderQuotes(pickDaily(state.quotesPool, state.sessionSeed));
    }
    state.lastShownDay = key;
  }

  function loadAll(){
    setStatus("لوڈ ہو رہا ہے…");
    Promise.all([fetchJson(QUOTES_URL), fetchJson(POETRY_URL)])
      .then(function(results){
        state.quotesPool = results[0] || [];
        state.poetryPool = results[1] || [];
        state.lastShownDay = todayKey();
        renderQuotes(pickDaily(state.quotesPool, state.sessionSeed));
        renderPoetry(state.poetryPool.slice(0, 10));
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          date: todayKey(),
          quotesPool: state.quotesPool,
          poetryPool: state.poetryPool
        }));
        setStatus("Updated " + new Date().toLocaleString("en-GB"));
      })
      .catch(function(err){
        // fall back to last cached data if the network isn't available
        var cached = localStorage.getItem(STORAGE_KEY);
        if (cached){
          try{
            var data = JSON.parse(cached);
            state.quotesPool = data.quotesPool || [];
            state.poetryPool = data.poetryPool || [];
            state.lastShownDay = todayKey();
            renderQuotes(pickDaily(state.quotesPool, state.sessionSeed));
            renderPoetry(state.poetryPool.slice(0, 10));
            setStatus("Offline — showing saved content");
            return;
          } catch(e){ /* ignore, fall through */ }
        }
        document.getElementById("quotesList").innerHTML =
          '<div class="error-state">اقوال لوڈ نہیں ہو سکے۔ انٹرنیٹ کنکشن چیک کریں۔</div>';
        document.getElementById("poetryList").innerHTML =
          '<div class="error-state">اشعار لوڈ نہیں ہو سکے۔ انٹرنیٹ کنکشن چیک کریں۔</div>';
        setStatus("Couldn't reach the network");
        console.error(err);
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", function(){
    state.sessionSeed += 1;
    if (state.quotesPool.length){
      renderQuotes(pickDaily(state.quotesPool, state.sessionSeed));
    } else {
      loadAll();
    }
  });

  setGregorianDate();
  loadAll();

  // Android/iOS don't reload the page when you reopen an installed app from
  // the background — they just resume the paused screen. Without this, the
  // JS that picks "today's" quotes never reruns, so the same set from
  // whenever the app was first opened keeps showing. This catches every
  // point where the app comes back to the foreground and re-checks the date.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") refreshIfNewDay();
  });
  window.addEventListener("focus", refreshIfNewDay);
  window.addEventListener("pageshow", refreshIfNewDay);

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(err){
        console.warn("Service worker registration failed:", err);
      });
    });
  }
})();
</script>
</body>
</html>
